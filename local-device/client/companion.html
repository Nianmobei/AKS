<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AKS · 委托与语气</title><style>body{font:16px/1.65 system-ui;background:#f5f3ef;color:#292b2d;margin:0}main{max-width:850px;margin:auto;padding:24px}article,section{background:white;border-radius:14px;padding:20px;margin:18px 0}textarea,input,select{display:block;box-sizing:border-box;width:100%;padding:10px;margin:8px 0 16px;font:inherit;border:1px solid #ccc;border-radius:8px}button{padding:8px 15px;background:#354b47;color:white;border:0;border-radius:8px;cursor:pointer;margin-right:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}small{color:#777}summary{cursor:pointer}</style><main><a href="/">返回聊天</a><h1>AKS 的委托与语气</h1><p id="status"></p><section><h2>语气矫正</h2><p>写一句短规则，整理后由你采纳。原对照只留档；每轮最多2条、合计240字。</p><label>下次希望她怎样说<textarea id="guidance" rows="2" maxlength="120" placeholder="例如：纠错时简短认错，不用工作承诺转移话题。"></textarea></label><details><summary>原对照与场景（选填）</summary><label>原回复<textarea id="original" rows="2" maxlength="4000"></textarea></label><label>理想回复<textarea id="preferred" rows="2" maxlength="4000"></textarea></label><label>备注<textarea id="reason" rows="2" maxlength="4000"></textarea></label><label>适用场景<input id="tags" placeholder="留空为通用；可填纠错、闲聊、安慰"></label></details><button id="save">整理并保存</button></section><section><h2>交给 Codex</h2><p>读取授权项目的文档摘录，产出新草稿。使用本机 Codex 额度；电脑关机时排队。</p><select id="project"><option value="waijing">外境 / WestMarch</option><option value="assistant">超级助手</option></select><textarea id="task" rows="3" placeholder="要做的工作"></textarea><textarea id="acceptance" rows="2" placeholder="验收标准，每行一条"></textarea><button id="submit">提交委托</button></section><h2>委托记录</h2><div id="jobs"></div><h2>语气范例</h2><div id="examples"></div></main><script>
const labels={queued:'排队等本机处理',running:'Codex正在处理','ready-for-review':'草稿已回传，等待AKS验收',accepted:'AKS已验收','revision-requested':'已提出返工',failed:'处理失败',pending:'待你采纳',approved:'已采纳',disabled:'已停用'};const $=s=>document.querySelector(s);async function api(action,payload={}){const r=await fetch('/companion-api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,payload})});const d=await r.json();if(!r.ok||d.error)throw Error(d.error||'连接失败');return d;}const show=e=>$('#status').textContent=e.message||e;
async function load(){try{const r=await api('list');$('#jobs').replaceChildren();for(const j of r.tasks){const el=document.createElement('article');const p=document.createElement('p');p.textContent=j.task+'\n状态：'+(labels[j.state]||j.state)+' · '+j.id;const b=document.createElement('button');b.textContent='查看成果与进度';const out=document.createElement('pre');b.onclick=async()=>{try{const d=await api('status',{id:j.id});out.textContent=(d.result?.answer||d.result?.error||'尚无成果。'+(labels[d.state]||d.state))+(d.review?'\n\n验收记录：'+d.review:'');}catch(e){show(e);}};el.append(p,b,out);$('#jobs').append(el);}$('#examples').replaceChildren();for(const e of r.feedback.filter(x=>!JSON.parse(x.tags).includes('隔离测试'))){
 const el=document.createElement('article');el.style.cssText='padding:12px 16px;margin:8px 0';
 const text=document.createElement('div');text.textContent=e.guidance||String(e.reason||e.preferred).slice(0,120);
 const status=document.createElement('small');status.textContent=labels[e.state]||e.state;
 const detail=document.createElement('details'),summary=document.createElement('summary');summary.textContent='修改 / 原对照';
 const edit=document.createElement('textarea');edit.rows=2;edit.maxLength=120;edit.value=text.textContent;
 const apply=document.createElement('button');apply.textContent='采纳这条短规则';apply.onclick=async()=>{try{await api('approve',{id:e.id,guidance:edit.value});await load();}catch(x){show(x)}};
 detail.append(summary,edit,apply);if(e.original||e.preferred||e.reason){const archive=document.createElement('pre');archive.textContent='原回复：'+e.original+'\n希望：'+e.preferred+'\n备注：'+e.reason;detail.append(archive)}
 const b=document.createElement('button');b.textContent=e.state==='approved'?'停用':'采纳';b.style.cssText='font-size:12px;padding:3px 9px;margin:4px 8px';b.onclick=async()=>{try{await api(e.state==='approved'?'deactivate':'approve',{id:e.id,...(e.state==='approved'?{}:{guidance:edit.value})});await load();}catch(x){show(x)}};
 el.append(text,status,b,detail);$('#examples').append(el);
}show('已读取云端记录');}catch(e){show(e);}}
$('#save').onclick=async()=>{try{await api('feedback',{guidance:$('#guidance').value,original:$('#original').value||'短规则录入',preferred:$('#preferred').value||$('#guidance').value,reason:$('#reason').value||$('#guidance').value,tags:$('#tags').value.split(/[，,、]/).map(x=>x.trim()).filter(Boolean).length?$('#tags').value.split(/[，,、]/).map(x=>x.trim()).filter(Boolean):['通用']});$('#guidance').value='';await load();}catch(e){show(e);}};$('#submit').onclick=async()=>{try{const d=await api('submit',{project:$('#project').value,task:$('#task').value,acceptance:$('#acceptance').value.split('\n').filter(Boolean)});show('已排队：'+d.id);await load();}catch(e){show(e);}};load();</script></html>
