<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AKS · 云端对话</title>
<style>body{margin:0;background:#f4f3f0;color:#25282b;font:16px/1.65 system-ui}main{max-width:800px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd}small{color:#777}article{white-space:pre-wrap;padding:16px 18px;margin:16px 0;background:white;border-radius:14px;overflow-wrap:anywhere}article.user{margin-left:15%;background:#e6eceb}article b{display:block;font-size:12px;color:#687773}article img{max-width:100%;max-height:400px}form{position:sticky;bottom:0;background:#f4f3f0;padding:14px 0}textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccc;border-radius:12px;font:inherit;resize:vertical}button{border:0;border-radius:8px;padding:10px 18px;background:#334c49;color:white;cursor:pointer}button:disabled{opacity:.5}#state{min-height:26px}#login{display:none}#qr{width:260px}</style>
<main><header><h2>AKS</h2><small id="release">云端会话 · 多设备续聊</small></header><div id="qqnotice" role="status"></div><div id="state">正在同步…</div><section id="messages"></section><form><textarea id="text" rows="3" placeholder="说些什么…"></textarea><input id="images" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple><button id="send">发送</button><small id="picked"></small></form><p><a href="/companion">委托与语气反馈</a></p><details><summary>日记与阅读记录</summary><button type="button" id="load-life">查看云端记录</button><pre id="life-result" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre></details><details><summary>QQ 云端登录</summary><button type="button" id="check">检查登录</button><button type="button" id="refresh">显示/刷新二维码</button><div id="qqstate"></div><img id="qr" hidden></details></main>
<script>
fetch('/release').then(async r=>{const d=await r.json();if(!r.ok||d.error)throw Error(d.error||'版本读取失败');document.querySelector('#release').textContent='云端 v'+d.version+(d.compatible?' · 已统一':' · 本地桥接需更新');}).catch(()=>{document.querySelector('#release').textContent='云端版本暂不可用';});
const $=s=>document.querySelector(s);let cursor=0,busy=false;const messages=new Map();
async function api(route,p={}){const r=await fetch(route,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});const data=await r.json();if(!r.ok||data.error)throw Error(data.error||'连接失败');return data;}
async function sync(){try{let more=true;while(more){const r=await api('/history',{after:cursor,limit:100});for(const m of r.messages){if(messages.has(m.seq))continue;messages.set(m.seq,m);const el=document.createElement('article');el.className=m.role;const name=document.createElement('b');name.textContent=m.role==='user'?'老板':'AKS';el.append(name,document.createTextNode(m.text));for(const a of m.assets||[]){const img=document.createElement('img');img.alt='附图';el.append(img);api('/asset-read',{id:a.id}).then(x=>img.src='data:'+x.mimeType+';base64,'+x.data).catch(()=>img.alt='图片暂未同步');}$('#messages').append(el);}cursor=r.cursor;more=r.messages.length===100;}if(!busy)$('#state').textContent='已与云端同步';}catch(e){$('#state').textContent=e.message;}}
$('#images').onchange=()=>$('#picked').textContent=$('#images').files.length+'张图片';
$('form').onsubmit=async e=>{e.preventDefault();if(busy)return;const text=$('#text').value.trim(),files=[...$('#images').files];if(!text&&!files.length)return;if(files.length>3){$('#state').textContent='一次最多3张图片';return;}busy=true;$('#send').disabled=true;$('#state').textContent='AKS 正在回复…';const id='device:'+crypto.randomUUID();try{const assetIds=[];for(const f of files){if(f.size>8*1024*1024)throw Error('单张图片不能超过8MB');const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.onerror=reject;r.readAsDataURL(f);});assetIds.push((await api('/asset-upload',{mimeType:f.type,data})).id);}await api('/turn',{id,text,assetIds,source:'device'});$('#text').value='';$('#images').value='';$('#picked').textContent='';await sync();window.scrollTo(0,document.body.scrollHeight);}catch(e){$('#state').textContent=e.message+'；请先核对历史后再重试';}finally{busy=false;$('#send').disabled=false;}};
$('#load-life').onclick=async()=>{try{const r=await fetch('/life');const d=await r.json();if(!r.ok)throw Error(d.error||'读取失败');const parts=['以下是保存的模拟活动与阅读、小说记录。'];for(const a of d.simulation?.recentCompleted||[])parts.push('【活动 '+(a.ended||'')+'】\n'+JSON.stringify(a.result,null,2));for(const n of (d.reading||[]).slice(0,20))parts.push('【阅读 '+(n.created||'')+'】'+(n.title||'')+'\n'+(n.fact||'')+'\n想法：'+(n.opinion||'')+(n.url?'\n来源：'+n.url:''));if(d.simulation?.novel)parts.push('【小说第'+d.simulation.novel.revision+'版】\n'+(d.simulation.novel.body||''));$('#life-result').textContent=parts.join('\n\n');}catch(e){$('#life-result').textContent=e.message}};
async function checkQq(){try{const r=await fetch('/qq-status').then(r=>r.json());$('#qqstate').textContent=r.message||(r.online?'QQ 已在线':r.phase||r.error||'尚未登录');$('#qqnotice').textContent=r.online?'':(r.message||'QQ 暂未连接')+'；AIRI 和云端资料仍可使用。';}catch(e){$('#qqstate').textContent=e.message;}};
$('#check').onclick=checkQq;setInterval(checkQq,60000);checkQq();
$('#refresh').onclick=async()=>{try{const r=await api('/qq-qr',{refresh:true});if(r.pending){$('#qqstate').textContent=r.message;return;}if(r.online){$('#qqstate').textContent='QQ 已在线';return;}$('#qr').src='data:'+r.mimeType+';base64,'+r.data;$('#qr').hidden=false;$('#qqstate').textContent='请用 AKS 小号扫码确认';}catch(e){$('#qqstate').textContent=e.message;}};sync();setInterval(sync,5000);
</script></html>
