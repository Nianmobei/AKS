<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Argon 独立试聊</title><style>body{margin:0;background:#f3f4f6;color:#20252d;font:16px/1.7 system-ui}main{max-width:800px;margin:auto;padding:28px}header,article,form{background:#fff;padding:20px;border-radius:14px;margin:16px 0}h1{font-size:25px;margin:0}small,#status{color:#596474}article{white-space:pre-wrap;overflow-wrap:anywhere}.user{background:#eaf0ff}textarea{box-sizing:border-box;width:100%;font:inherit;padding:12px;border:1px solid #bac3d0;border-radius:8px}button,select{font:inherit;padding:8px 12px;margin:8px 8px 0 0}button{cursor:pointer}#status{min-height:28px}a{color:#315daa}</style><main><header><h1>Argon 独立试聊</h1><p>固定请求 API易 · gemini-4-argon。失败直接报错，不自动切到 DeepSeek。</p><label>试聊方式 <select id="mode"><option value="plain">纯模型：自然聊天</option><option value="persona">小A固定人格</option></select></label><button id="reset" type="button">开始新会话</button><p><small>这里的历史与日常聊天分开，不读共同记忆、作品库，也不执行工具。测试文字会保存在云端并产生 API 费用。切换方式会开始新会话。</small></p><a href="/">返回日常聊天</a></header><section id="messages" aria-live="polite"></section><form id="form"><textarea id="input" rows="4" maxlength="12000" placeholder="直接和 Argon 聊聊…" required></textarea><button id="send">发送</button><div id="status" role="status">尚未发送</div></form></main><script>
const $=s=>document.querySelector(s);let conversation,busy=false;
function reset(){conversation='lab-argon-only-'+$('#mode').value+'-'+crypto.randomUUID();$('#messages').replaceChildren();$('#status').textContent='新会话已就绪';}
function add(role,text){const e=document.createElement('article');e.className=role;e.textContent=(role==='user'?'你：':'Argon：')+text;$('#messages').append(e);}
$('#reset').onclick=reset;$('#mode').onchange=reset;reset();
$('#form').onsubmit=async e=>{e.preventDefault();if(busy)return;const text=$('#input').value.trim();if(!text)return;busy=true;$('#send').disabled=true;$('#mode').disabled=true;$('#reset').disabled=true;add('user',text);$('#input').value='';const at=Date.now();$('#status').textContent='等待 Argon 回复…';try{const r=await fetch('/argon-test/turn',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:'argon-test:'+crypto.randomUUID(),text,conversation})});const d=await r.json();if(!r.ok||d.error)throw Error(d.error||'请求失败');add('assistant',d.reply);$('#status').textContent='API易 / gemini-4-argon · '+((Date.now()-at)/1000).toFixed(1)+' 秒 · 未使用回退';}catch(err){$('#status').textContent='Argon 请求失败，未切换其他模型：'+err.message+'。不自动重试。';}finally{busy=false;$('#send').disabled=false;$('#mode').disabled=false;$('#reset').disabled=false;}};
</script></html>
